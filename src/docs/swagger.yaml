openapi: 3.0.0

info:
  title: Auth API
  version: 1.0.0

servers:
  - url: http://localhost:5000/api/v1

paths:

  /auth/register:
    post:
      summary: Register user
      responses:
        201:
          description: User created

  /auth/login:
    post:
      summary: Login user
      responses:
        200:
          description: Login success

  /users/profile:
    get:
      summary: Get profile
      security:
        - bearerAuth: []
      responses:
        200:
          description: Profile data

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
